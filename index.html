<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Total Amount</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <form id="entry-form" class="entry-form" autocomplete="off">
        <div class="field">
          <input id="number" name="number" type="text" placeholder="0" required>
          <label for="number">Number</label>
        </div>
        <div class="field">
          <input id="quantity" name="quantity" type="number" min="0.01" step="any" placeholder="0" required>
          <label for="quantity">Quantity</label>
        </div>
        <div class="field">
          <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal" required>
          <label for="amount">Enter Amount</label>
        </div>
        <button class="button add-button" type="submit">ADD</button>
      </form>

      <section aria-label="Entries" class="entries">
        <table>
          <thead>
            <tr><th scope="col">Number</th><th scope="col">Quantity</th><th scope="col">Amount</th><th scope="col">Total Amount</th></tr>
          </thead>
          <tbody id="entry-rows"></tbody>
        </table>
      </section>

      <section class="summary" aria-label="Total amount">
        <div id="overview-actions" class="summary-actions" hidden>
          <span class="overview-label">Overview</span>
          <p class="overview-total-label">Total Amount: <output id="overview-total">0.00</output></p>
          <div class="overview-buttons">
            <button id="reset-button" class="button export-button" type="button">RESET</button>
            <button id="export-button" class="button export-button" type="button">EXPORT CSV</button>
          </div>
        </div>
        <div class="summary-result">
          <span class="summary-label">TOTAL AMOUNT</span>
          <output id="total-amount" class="summary-total">0.00</output>
        </div>
      </section>

      <div class="submit-row">
        <button id="submit-button" class="button" type="button">PAY</button>
      </div>


    </main>
    <script src="app.js"></script>
  </body>
</html>
